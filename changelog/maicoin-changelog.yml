scheme: dated entries, additions only
current_version: v3
note: >-
  MaiCoin keeps two independent changelogs and neither is a standalone page: the REST changelog is
  embedded inside the OpenAPI document's info.description (so it is machine-readable only as prose
  inside the spec), and the WebSocket changelog is a markdown file in the docs repo using its own
  semantic versions (25.x) unrelated to the REST v3 number. There is no combined feed, no RSS, and
  no dated page an agent can subscribe to. Every REST entry to date is an addition; no removal or
  breaking change has ever been announced.
