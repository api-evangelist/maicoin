note: >-
  Derived from the published contract. The MAX data model is shallow by design — it is a trading
  API, so most definitions are flat read models rather than a linked object graph. Only a handful
  of genuine foreign keys exist, and they are expressed as bare integer/string id fields rather
  than $ref links, so the relationships below were read from field names and their documented
  descriptions, not from schema composition.
identifiers:
  order_id:
    field: id
    type: integer
    note: Server-assigned order identifier.
  client_order_id:
    field: client_oid
    type: string
    max_length: 36
    note: Client-assigned, unique per account for 24 hours. See conventions/ idempotency.
  group_order_id:
    field: group_id
    type: integer
    note: Groups related orders; nullable.
  trade_id:
    field: id
    type: integer
  serial_number:
    field: sn
    type: string
    note: Used to address deposits, withdrawals and fund transactions.
  market_id:
    field: market
    type: string
    note: Lowercase concatenation of base and quote unit, e.g. btctwd. Enumerated in the contract (77 markets).
  currency_id:
    field: currency
    type: string
    note: Lowercase currency code, e.g. btc, twd, usdt.
