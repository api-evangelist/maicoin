wallet_partition:
  note: >-
    A structural feature worth calling out: `path_wallet_type` is a PATH parameter on seven
    operations, taking `spot` or `m`. The same order, trade, and account entities exist separately
    in each wallet, so an agent must carry wallet context through every call — the entity id alone
    does not identify which wallet it belongs to.
  operations: [getApiV3WalletPathWalletTypeTrades, getApiV3WalletPathWalletTypeOrdersOpen, getApiV3WalletPathWalletTypeOrdersClosed, getApiV3WalletPathWalletTypeOrdersHistory, postApiV3WalletPathWalletTypeOrder, deleteApiV3WalletPathWalletTypeOrders, getApiV3WalletPathWalletTypeAccounts]
