components:
  schemas:
    External_V3_Entities_Deposit:
      type: object
      properties:
        uuid:
          type: string
          example: '18022603540001'
          description: unique deposit id
        currency:
          type: string
          example: usdt
          description: currency id
        network_protocol:
          type: string
          example: ethereum-erc20
          description: network protocol of currency
        amount:
          type: string
          example: '0.019'
          description: deposit amount
        to_address:
          type: string
          example: '0x5c7d23d516f120d322fc7b116386b7e491739138'
          description: to_address/virtual account number
        txid:
          type: string
          example: '0x8daa98e07886985bd6a142cd81b83582d6085f7eb931dc4984c18c84f2a845e0'
          description: unique transaction id
        created_at:
          type: integer
          format: int32
          example: 1521726960357
          description: received timestamp (millisecond)
        confirmations:
          type: integer
          format: int32
          example: 64
          description: confirmations for crypto currency
        state:
          type: string
          example: pending
          description: deposit state, processing/failed/canceled/done
        state_reason:
          type: string
          example: ''
          description: state reason, blank if no further action needed
      required:
      - uuid
      - currency
      - network_protocol
      - amount
      - to_address
      - txid
      - created_at
      - confirmations
      - state
      - state_reason
      description: External_V3_Entities_Deposit model
    External_V3_Entities_FundTransactions_Deposit:
      type: object
      properties:
        sn:
          type: string
          example: '18022603540001'
          description: unique deposit id
        is_internal:
          type: boolean
          example: false
          description: whether it's an internal transfer
        currency:
          type: string
          example: usdt
          description: currency id
        amount:
          type: string
          example: '0.019'
          description: deposit amount
        state:
          type: string
          example: processing
          description: deposit state, processing/failed/canceled/done
        created_at:
          type: integer
          format: int32
          example: 1521726960123
          description: created timestamp (millisecond)
        network_protocol:
          type:
          - string
          - 'null'
          example: ethereum-erc20
          description: network protocol of currency, null for internal deposit
        to_address:
          type:
          - string
          - 'null'
          example: '0x5c7d23d516f120d322fc7b116386b7e491739138'
          description: to_address/virtual account number, null for internal deposit
        txid:
          type:
          - string
          - 'null'
          example: 0x8daa98e07886985bd6a142cd81b83582d6085f7eb931dc4984c18c84f2a845e0, null for internal deposit
          description: unique transaction id
        from:
          type:
          - string
          - 'null'
          example: pr***@***.com
          description: from member in email, null for external deposit
      required:
      - sn
      - is_internal
      - currency
      - amount
      - state
      - created_at
      - network_protocol
      - to_address
      - txid
      - from
      description: External_V3_Entities_FundTransactions_Deposit model
    External_V3_Entities_FundTransactions_Withdrawal:
      type: object
      properties:
        sn:
          type: string
          example: '18022603540001'
          description: unique withdraw id
        is_internal:
          type: boolean
          example: false
          description: whether it's an internal transfer
        currency:
          type: string
          example: usdt
          description: currency id
        amount:
          type: string
          example: '0.019'
          description: deposit amount
        state:
          type: string
          example: processing
          description: deposit state, processing/failed/canceled/done
        created_at:
          type: integer
          format: int32
          example: 1521726960123
          description: created timestamp (millisecond)
        network_protocol:
          type:
          - string
          - 'null'
          example: ethereum-erc20
          description: network protocol of currency, null for internal withdraw
        fee:
          type:
          - string
          - 'null'
          example: '0.0'
          description: withdraw fee, null for internal withdraw
        fee_currency:
          type:
          - string
          - 'null'
          example: eth
          description: withdraw fee currency, null for internal withdraw
        to_address:
          type:
          - string
          - 'null'
          example: TU91BoeyrqW9MKaiRPDiE6z7UecK2n2Hze
          description: to_address/email/mark bank account, null for internal withdraw
        label:
          type:
          - string
          - 'null'
          example: My Web3 Wallet
          description: label text on to_address/email or 7-digit bank branch code, null for internal withdraw
        txid:
          type:
          - string
          - 'null'
          example: 957e1f1a1ba878ed0feebb2dd8a0cdbd9ed59ff501238fae199d8713f19c06f2
          description: txid, null for internal withdraw
        to:
          type:
          - string
          - 'null'
          example: member@maicoin.com
          description: email/address, null for external withdraw
      required:
      - sn
      - is_internal
      - currency
      - amount
      - state
      - created_at
      - network_protocol
      - fee
      - fee_currency
      - to_address
      - label
      - txid
      - to
      description: External_V3_Entities_FundTransactions_Withdrawal model
    postApiV3Withdrawal:
      type: object
      properties:
        withdraw_address_uuid:
          type: string
          description: unique withdraw address id, check GET /api/v3/withdraw_addresses for available withdraw addresses
          example: 508c9af6-ccc1-4122-b38f-a407e3bac96c
        amount:
          type: string
          description: withdraw amount
          example: '0.019'
      required:
      - withdraw_address_uuid
      - amount
      description: Submit a crypto withdrawal. IP whitelist for api token is required.
    External_V3_Entities_FundTransactions_Reward:
      type: object
      properties:
        sn:
          type: string
          example: '18022603540001'
          description: unique reward id
        currency:
          type: string
          example: usdt
          description: currency id
        amount:
          type: string
          example: '0.019'
          description: reward amount
        state:
          type: string
          example: processing
          description: reward state, processing/failed/canceled/done
        created_at:
          type: integer
          format: int32
          example: 1521726960123
          description: created timestamp (millisecond)
        type:
          type: string
          example: airdrop_reward
          description: reward type
        note:
          type: string
          example: 2018-11-13 Holding Reward
          description: reward description
        to_sn:
          type: string
          example: s1-example
          description: reward sub account serial number
      required:
      - sn
      - currency
      - amount
      - state
      - created_at
      - type
      - note
