      parameters:
      - in: query
        name: markets
        description: 'Array of market id, check /api/v3/markets for available markets. Use bracket notation for array parameters. ex: ?markets[]=btcusdt&markets[]=ethusdt'
        required: true
        schema:
          type: array
          items:
