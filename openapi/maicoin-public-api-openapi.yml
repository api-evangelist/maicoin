  /api/v3/ticker:
    get:
      description: get ticker of specific market
      parameters:
      - in: query
        name: market
        description: unique market id, check /api/v3/markets for available markets
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ticker is within 24 hours, "at" is timestamp in seconds since Unix epoch
