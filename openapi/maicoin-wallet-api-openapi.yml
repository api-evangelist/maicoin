  /api/v3/deposit_address:
    get:
      summary: get user deposit address by currency version
      description: The address could be empty before generated, please request again in that case
      parameters:
      - in: header
        name: X-MAX-ACCESSKEY
        description: access key
        required: true
        schema:
          type: string
      - in: header
        name: X-MAX-PAYLOAD
