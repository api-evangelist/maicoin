apis:
- aid: maicoin-max-rest-v3
  name: MAX Exchange REST API v3
  description: The MAX Exchange V3 RESTful API — 54 operations across public market data, spot and margin
    (m-wallet) order management, trade history, wallet balances, deposits, withdrawals, internal transfers,
    rewards, currency conversion and margin loans. Public endpoints are unauthenticated and limited to
    1200 requests per minute per IP; private endpoints require HMAC-SHA256 signed requests and are limited
    to 1200 requests per minute per account.
  humanURL: https://campaign.maicoin.com/en/api-document
  baseURL: https://max-api.maicoin.com
  tags:
  - Trading
  - Market Data
  - Cryptocurrency
  - Wallet
  - Order Management
  properties:
  - type: OpenAPI
    url: openapi/maicoin-max-v3-openapi.json
  - type: Documentation
    url: https://campaign.maicoin.com/en/api-document
  - type: APIReference
    url: https://max-api.maicoin.com/doc/v3.html
- aid: maicoin-max-websocket
  name: MAX Exchange WebSocket API
  description: Real-time streaming service for MAX Exchange. Public channels cover order book (book),
    trade, ticker, kline, market_status and m-wallet pool_quota; private channels stream order snapshots/updates,
    trade snapshots/updates, account balance updates and m-wallet order/trade/ad_ratio/borrowing events
    after HMAC-SHA256 nonce authentication.
  humanURL: https://maicoin.github.io/max-websocket-docs/
  baseURL: wss://max-stream.maicoin.com/ws
  tags:
  - WebSocket
  - Streaming
  - Market Data
  - Real Time
  properties:
  - type: Documentation
    url: https://maicoin.github.io/max-websocket-docs/
- aid: maicoin-max-status
  name: MAX System Status API
  description: Unauthenticated system status endpoint reporting whether the MAX API is online or in maintenance,
    with an ISO 8601 last_changed_at timestamp. Documented in the MAX V3 API reference; status updates
    may lag by up to 30 seconds.
  humanURL: https://status-max.maicoin.com/
  baseURL: https://status-api-max.maicoin.com
  tags:
  - Status
  - Operations
  properties:
  - type: Documentation
    url: https://max-api.maicoin.com/doc/v3.html
