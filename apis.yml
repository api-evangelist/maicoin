aid: maicoin
name: MaiCoin
description: MaiCoin is a Taiwan-based digital asset group that operates MAX (MaiCoin Assets eXchange),
  a regulated cryptocurrency exchange offering spot trading, margin borrowing (m-wallet), staking, and
  fiat TWD on/off-ramps. MAX publishes a public V3 RESTful trading API with 54 operations spanning public
  market data (markets, tickers, order book depth, k-line, public trades), order management, trade history,
  wallet and account balances, deposits and withdrawals, internal transfers, currency conversion, and
  margin loan/repayment/liquidation. A companion WebSocket streaming service delivers real-time order
  book, ticker, k-line, trade, market status and private order/trade/account events. Authentication uses
  HMAC-SHA256 request signing over a base64 payload with X-MAX-ACCESSKEY, X-MAX-PAYLOAD and X-MAX-SIGNATURE
  headers.
