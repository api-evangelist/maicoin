note: >-
  RECORDED ABSENCE. No /.well-known/ document is served on any MaiCoin host. Every path
  probed returned a 404 or was answered by a Cloudflare managed challenge; not one returned
  a real document. No WellKnown, APICatalog or SecurityTxt pointer is emitted in apis.yml,
  because a pointer would assert that MaiCoin serves a surface it does not serve.
  max-api.maicoin.com and campaign.maicoin.com return honest 404s. max.maicoin.com,
  www.maicoin.com and status-api-max.maicoin.com sit behind a Cloudflare managed challenge
  that answers 403/429 with an HTML interstitial for every path including these — that is a
  bot policy, not evidence of a document, and is recorded as challenged rather than as absent.
