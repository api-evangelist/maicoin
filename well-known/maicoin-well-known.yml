related_finding: >-
  The maicoin.com zone does publish a machine-readable security contact, but via DNS rather
  than /.well-known/ — the CAA record carries `0 iodef "mailto:security@maicoin.com"`. That is
  a certificate-problem reporting address under RFC 8659, not a vulnerability disclosure
  policy, so it does not earn a Security pointer. See security/maicoin-domain-security.yml.
