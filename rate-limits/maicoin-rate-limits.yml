response_headers:
  rest:
    rate_limit_headers: []
    note: >-
      None served. Verified by live probe 2026-08-25 against GET https://max-api.maicoin.com/api/v3/markets.
    observed_other:
    - x-request-id
    - x-runtime
    - strict-transport-security
  websocket:
    rate_limit_headers:
    - Retry-After
    note: >-
      Per the WebSocket docs: "A Retry-After header is included in 429 responses, indicating the
      Unix timestamp in seconds for when you can reconnect." Note this is a Unix timestamp, not the
      delta-seconds form RFC 9110 defines for Retry-After — a client implementing the RFC literally
      would sleep for ~1.7 billion seconds. Deviation recorded in conformance/maicoin-conformance.yml.
enforcement:
  penalty: >-
    "Receiving a 429 response will result in an automatic IP ban." Violations carry a penalty period
    that must be waited out in full; requesting during the penalty resets and prolongs the ban.
  source: https://maicoin.github.io/max-websocket-docs/
tier_variation:
  documented: false
  note: >-
