limit_count: 6
note: >-
  MaiCoin publishes hard numbers for both the REST and the WebSocket surface, but ships NO
  rate-limit response headers on REST. A live unauthenticated probe of GET /api/v3/markets on
  2026-08-25 returned date, server, cache-control, x-request-id, x-runtime, strict-transport-security
  and cf-* headers, and no RateLimit-*, X-RateLimit-* or Retry-After header. An agent therefore
  cannot read remaining quota at runtime on REST; it can only count its own requests against the
  documented ceiling. The WebSocket surface is better: a 429 there carries Retry-After.
