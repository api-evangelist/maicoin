- id: llmstxt
  conforms: true
  evidence: >-
    TWO real llms.txt files are served, both HTTP 200 — https://max-api.maicoin.com/llms.txt (the
    API-focused one, which names the OpenAPI location and an AI usage policy) and
    https://campaign.maicoin.com/llms.txt (a 15KB site index). This is a genuinely above-average
    agent-readiness signal and is how this profile located the machine-readable contract.
domain_standards:
  assessed: true
  regime: cryptocurrency exchange / virtual asset service provider
  findings:
  - id: fix-protocol
    conforms: false
    evidence: No FIX gateway is published or referenced anywhere in MaiCoin's documentation.
    note: FIX 4.4/5.0 is the incumbent institutional standard for order entry and market data. MAX offers REST and a bespoke WebSocket protocol only.
  - id: iso-20022
    conforms: false
    evidence: No ISO 20022 message type appears in the contract; TWD fiat withdrawal uses a proprietary body.
  - id: fdx
    conforms: false
    evidence: Not applicable — no open-banking account-aggregation surface.
  summary: >-
    REWARD-ONLY DIMENSION, NOT PENALISED. The crypto-exchange market has no mandatory
    machine-readable domain standard that MAX declines to implement; venue-specific REST plus a
    proprietary WebSocket protocol is the sector norm, and MAX's shape matches its peers. FIX is
    recorded above because it is the one recognised standard a venue at this tier could adopt, and
    its absence is a real (if unremarkable) differentiator against institutional-facing exchanges.
compliance_certifications:
  published: false
  note: >-
    No trust centre, SOC 2, ISO 27001, PCI or equivalent certification page was found on any
    MaiCoin host (probe-security-programs.py returned vdp=none trust=none on 2026-08-25). MaiCoin
    is a registered Taiwanese VASP and publishes terms and a privacy policy, but no named security
    certification, so NO Compliance pointer is emitted.
